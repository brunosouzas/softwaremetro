name: Release PR

# Delivery model 2 (package-release spec, Release pull request): release-please keeps the release pull
# request (version in package.json and npm-shrinkwrap.json, CHANGELOG.md) from the Conventional Commit
# titles that reach main. Merging it changes the version, so release.yml publishes it after the owner's
# approval and makes the tag; release-please never creates the tag here (skip-github-release). Runs as
# the release app brunosouzas-stackledger-release in the environment release-please (main only).
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    uses: brunosouzas/github-reusable-workflows/.github/workflows/release-please.yml@v0.1.0
    with:
      skip-github-release: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
